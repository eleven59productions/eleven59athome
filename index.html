<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff2a2a">
<title>@HOME — Produced by 11:59</title>
<meta name="description" content="@HOME. A series about where and how we watch movies. Produced by 11:59.">
<meta property="og:type" content="website">
<meta property="og:title" content="@HOME — Produced by 11:59">
<meta property="og:description" content="Are you there?">
<meta property="og:url" content="https://eleven59athome.com/">
<style>
:root{--red:#ff2a2a;--white:#fff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--red);color:var(--white)}
body{font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
.topbar{position:fixed;top:22px;left:28px;right:28px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;color:#fff;font-size:10px;font-weight:800;letter-spacing:1.5px;white-space:nowrap}
.topbar button{display:block;border:0;padding:0;background:none;color:inherit;font:inherit;letter-spacing:inherit;cursor:pointer;text-decoration:none;text-underline-offset:4px;text-decoration-thickness:1px}
.topbar button[aria-pressed="true"]{text-decoration:underline}
.topbar button:hover,.topbar button:focus-visible{opacity:.75}
@media(max-width:600px){.topbar{top:22px;left:19px;right:19px;font-size:8px;letter-spacing:1px}}
main{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.lockup{display:flex;flex-direction:column;align-items:center;text-align:center;gap:0;transform:translateY(-4vh)}
h1{font-size:clamp(56px,9vw,112px);font-weight:800;letter-spacing:-.07em;line-height:1;margin:0;white-space:nowrap}
h1 button{display:inline-block;border:0;padding:0;background:none;color:#fff;font:inherit;letter-spacing:inherit;line-height:inherit;cursor:pointer;animation:home-blink 1.304347826s steps(1,end) infinite}
@keyframes home-blink{0%,49.99%{color:#fff}50%,100%{color:#111}}
h1 button:hover,h1 button:focus-visible{color:#fff!important;animation:none}
.question{font-size:13px;font-weight:500;letter-spacing:.045em;margin:28px 0 0}
.house{font-size:24px;line-height:1;margin-top:26px}
.moving-pair{display:flex;flex-direction:column;align-items:center;transform:translate3d(0,0,0);will-change:transform;position:relative;pointer-events:none}
.moving-pair .spin-button{pointer-events:auto}
.spin-face{display:inline-block;transform-style:preserve-3d;backface-visibility:visible;animation:home-spin 9s linear infinite}
.spin-button{appearance:none;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}
.spin-button .spin-face{animation-duration:9s}
.spin-button.fast .spin-face{animation-duration:1.5s}
.spin-button:focus-visible{outline:1px solid currentColor;outline-offset:5px}
@keyframes home-spin{to{transform:rotateY(360deg)}}
.site-link{margin-top:29px;font-size:10px;letter-spacing:.025em;color:#fff;text-decoration:underline;text-underline-offset:3px;transition:opacity .25s ease}
.site-link:hover,.site-link:focus-visible{opacity:.65}
.noise{position:fixed;inset:0;z-index:0;background:#111;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .65s ease,visibility 0s linear .65s}
.noise.active{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .65s ease,visibility 0s}
.noise canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
main{position:relative;z-index:1;pointer-events:none}
.lockup h1 button,.site-link,.moving-pair .spin-button{pointer-events:auto}
body.static-mode h1 button{animation:home-blink-static 1.304347826s steps(1,end) infinite}
@keyframes home-blink-static{0%,49.99%{color:#fff}50%,100%{color:#111}}
body.static-mode h1 button:hover,body.static-mode h1 button:focus-visible{animation-play-state:paused;color:var(--red)!important}
body.static-mode .question{color:var(--red)}
body.static-mode .site-link{color:#fff}

@media(max-width:600px){h1{font-size:clamp(52px,15vw,82px)}.question{margin-top:25px}.house{margin-top:24px}.site-link{margin-top:27px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="topbar" aria-label="Los Angeles date and time"><button type="button" id="la-date" data-motion="horizontal" aria-pressed="false"></button><button type="button" data-motion="diagonal" aria-pressed="false">LOS ANGELES</button><button type="button" id="la-time" data-motion="vertical" aria-pressed="false"></button></header>
<div class="noise" id="noise" aria-hidden="true"><canvas id="noise-canvas"></canvas></div>
<main><div class="lockup">
<h1><button type="button" id="home-trigger" aria-label="Toggle television static">@HOME</button></h1>
<div class="moving-pair" id="moving-pair"><p class="question"><button type="button" class="spin-button" aria-label="Spin Are you there faster"><span class="spin-face">Are you there?</span></button></p>
<div class="house"><button type="button" class="spin-button" aria-label="Spin house faster"><span class="spin-face" role="img" aria-label="House">🏠</span></button></div></div>
<a class="site-link" href="https://eleven59.com/">eleven59.com</a>
</div></main>
<script>
function updateTopbar(){
 const now=new Date();
 const fmt=options=>new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',...options}).format(now);
 document.getElementById('la-date').textContent=fmt({month:'2-digit',day:'2-digit',year:'numeric'});
 document.getElementById('la-time').textContent=fmt({hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true});
}
updateTopbar();setInterval(updateTopbar,1000);
const overlay=document.getElementById('noise');
const canvas=document.getElementById('noise-canvas');
const ctx=canvas.getContext('2d',{alpha:false});
let active=false,frame=null,w=0,h=0;
function sizeCanvas(){
 const scale=Math.min(1,devicePixelRatio||1);
 w=Math.max(1,Math.floor(innerWidth*scale));
 h=Math.max(1,Math.floor(innerHeight*scale));
 canvas.width=w;canvas.height=h;
}
function draw(){
 if(!active)return;
 const img=ctx.createImageData(w,h),data=img.data;
 for(let i=0;i<data.length;i+=4){
  const n=Math.random()*256|0;
  data[i]=data[i+1]=data[i+2]=n;data[i+3]=255;
 }
 ctx.putImageData(img,0,0);
 frame=requestAnimationFrame(draw);
}
function toggleStatic(){
 active=!active;
 document.body.classList.toggle('static-mode',active);
 overlay.classList.toggle('active',active);
 overlay.setAttribute('aria-hidden',String(!active));
 if(active){sizeCanvas();frame=requestAnimationFrame(draw)}
 else{cancelAnimationFrame(frame);frame=null}
}
document.querySelectorAll('.spin-button').forEach(button=>{
 button.addEventListener('click',()=>{
  button.classList.add('fast');
  clearTimeout(button._spinTimeout);
  button._spinTimeout=setTimeout(()=>button.classList.remove('fast'),2800);
 });
});
const pair=document.getElementById('moving-pair');
const motion={enabled:false,x:0,y:0,vx:0,vy:0,last:performance.now(),mode:null};
function bounds(){
 const rect=pair.getBoundingClientRect();
 // Resolve the current translation into the untransformed position.
 return {left:rect.left-motion.x,top:rect.top-motion.y,width:rect.width,height:rect.height};
}
document.querySelectorAll('.topbar [data-motion]').forEach(button=>{
 button.addEventListener('click',()=>{
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const wasActive=button.getAttribute('aria-pressed')==='true';
  document.querySelectorAll('.topbar [data-motion]').forEach(b=>b.setAttribute('aria-pressed','false'));
  if(wasActive){
   motion.vx=-motion.vx;
   motion.vy=-motion.vy;
  }else{
   button.setAttribute('aria-pressed','true');
   const speed=innerWidth<700?42:58;
   const dx=Math.sign(motion.vx)||1,dy=Math.sign(motion.vy)||1;
   motion.vx=button.dataset.motion==='vertical'?0:dx*speed;
   motion.vy=button.dataset.motion==='horizontal'?0:dy*speed*(button.dataset.motion==='diagonal'?.78:1);
   motion.mode=button.dataset.motion;
  }
  motion.enabled=true;
  motion.last=performance.now();
 });
});
function animateMovement(now){
 const elapsed=Math.min(.05,Math.max(0,(now-motion.last)/1000));
 motion.last=now;
 if(motion.enabled){
  const b=bounds();
  const minX=-b.left,maxX=innerWidth-b.left-b.width;
  const minY=70-b.top,maxY=innerHeight-25-b.top-b.height;
  motion.x+=motion.vx*elapsed;
  motion.y+=motion.vy*elapsed;
  if(motion.x<minX||motion.x>maxX){motion.x=Math.max(minX,Math.min(maxX,motion.x));motion.vx=-motion.vx}
  if(motion.y<minY||motion.y>maxY){motion.y=Math.max(minY,Math.min(maxY,motion.y));motion.vy=-motion.vy}
  pair.style.transform='translate3d('+motion.x+'px,'+motion.y+'px,0)';
 }
 requestAnimationFrame(animateMovement);
}
requestAnimationFrame(animateMovement);
document.getElementById('home-trigger').addEventListener('click',toggleStatic);
overlay.addEventListener('click',toggleStatic);
window.addEventListener('resize',()=>{if(active)sizeCanvas()});
</script>
</body>
</html>
