<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff2a2a">
<title>@HOME — Produced by 11:59</title>
<meta name="description" content="@HOME. A series about where and how we watch movies. Produced by 11:59.">
<meta property="og:type" content="website">
<meta property="og:title" content="@HOME — Produced by 11:59">
<meta property="og:description" content="Are you there?">
<meta property="og:url" content="https://eleven59athome.com/">
<style>
:root{--red:#ff2a2a;--white:#fff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--red);color:var(--white)}
body{font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
main{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.lockup{display:flex;flex-direction:column;align-items:center;text-align:center;gap:0;transform:translateY(-4vh)}
h1{font-size:clamp(56px,9vw,112px);font-weight:800;letter-spacing:-.07em;line-height:1;margin:0;white-space:nowrap}
h1 button{display:inline-block;border:0;padding:0;background:none;color:#fff;font:inherit;letter-spacing:inherit;line-height:inherit;cursor:pointer;animation:home-blink 1.304347826s steps(1,end) infinite}
@keyframes home-blink{0%,49.99%{color:#fff}50%,100%{color:#111}}
h1 button:hover,h1 button:focus-visible{color:var(--red)!important;animation:none}
.question{font-size:11px;font-weight:500;letter-spacing:.045em;margin:28px 0 0}
.house{font-size:19px;line-height:1;margin-top:26px}
.spin-face{display:inline-block;transform-style:preserve-3d;backface-visibility:visible;animation:home-spin 9s linear infinite}
@keyframes home-spin{to{transform:rotateY(360deg)}}
.site-link{margin-top:29px;font-size:10px;letter-spacing:.025em;color:#fff;text-decoration:underline;text-underline-offset:3px;transition:opacity .25s ease}
.site-link:hover,.site-link:focus-visible{opacity:.65}
.noise{position:fixed;inset:0;z-index:0;background:#111;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .65s ease,visibility 0s linear .65s}
.noise.active{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .65s ease,visibility 0s}
.noise canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
main{position:relative;z-index:1;pointer-events:none}
.lockup h1 button,.site-link{pointer-events:auto}
body.static-mode h1 button{animation:home-blink-static 1.304347826s steps(1,end) infinite}
@keyframes home-blink-static{0%,49.99%{color:#fff}50%,100%{color:#111}}
body.static-mode h1 button:hover,body.static-mode h1 button:focus-visible{animation-play-state:paused;color:var(--red)!important}
body.static-mode .question{color:var(--red)}
body.static-mode .site-link{color:#fff}

@media(max-width:600px){h1{font-size:clamp(52px,15vw,82px)}.question{margin-top:25px}.house{margin-top:24px}.site-link{margin-top:27px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="noise" id="noise" aria-hidden="true"><canvas id="noise-canvas"></canvas></div>
<main><div class="lockup">
<h1><button type="button" id="home-trigger" aria-label="Toggle television static">@HOME</button></h1>
<p class="question"><span class="spin-face">Are you there?</span></p>
<div class="house" role="img" aria-label="House"><span class="spin-face">🏠</span></div>
<a class="site-link" href="https://eleven59.com/">eleven59.com</a>
</div></main>
<script>
const overlay=document.getElementById('noise');
const canvas=document.getElementById('noise-canvas');
const ctx=canvas.getContext('2d',{alpha:false});
let active=false,frame=null,w=0,h=0;
function sizeCanvas(){
 const scale=Math.min(1,devicePixelRatio||1);
 w=Math.max(1,Math.floor(innerWidth*scale));
 h=Math.max(1,Math.floor(innerHeight*scale));
 canvas.width=w;canvas.height=h;
}
function draw(){
 if(!active)return;
 const img=ctx.createImageData(w,h),data=img.data;
 for(let i=0;i<data.length;i+=4){
  const n=Math.random()*256|0;
  data[i]=data[i+1]=data[i+2]=n;data[i+3]=255;
 }
 ctx.putImageData(img,0,0);
 frame=requestAnimationFrame(draw);
}
function toggleStatic(){
 active=!active;
 document.body.classList.toggle('static-mode',active);
 overlay.classList.toggle('active',active);
 overlay.setAttribute('aria-hidden',String(!active));
 if(active){sizeCanvas();frame=requestAnimationFrame(draw)}
 else{cancelAnimationFrame(frame);frame=null}
}
document.getElementById('home-trigger').addEventListener('click',toggleStatic);
overlay.addEventListener('click',toggleStatic);
window.addEventListener('resize',()=>{if(active)sizeCanvas()});
</script>
</body>
</html>
