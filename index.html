<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>@HOME — Presented by 11:59</title>
  <meta name="description" content="@HOME. A series about where and how we watch movies. Produced by 11:59.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="@HOME — Produced by 11:59">
  <meta property="og:description" content="Where and how we watch movies. Coming soon.">
  <meta property="og:url" content="https://eleven59athome.com/">
  <style>
    :root{color-scheme:light;--ink:#151515;--accent:#ff2a2a}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#fff;color:var(--ink)}
    body{font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
    main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 22px;text-align:center}
    h1{margin:0;font-size:clamp(64px,15vw,180px);line-height:.88;font-weight:900;letter-spacing:-.095em;white-space:nowrap}
    .subtitle{margin:26px 0 0;font-size:clamp(10px,1.2vw,13px);line-height:1.65;letter-spacing:.055em}
    .coming{margin-top:13px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
    footer{position:fixed;bottom:clamp(24px,5vh,54px);left:0;width:100%;text-align:center;font-size:10px;line-height:1.9;letter-spacing:.05em}
    footer a{color:var(--accent);font-weight:800;text-decoration:none}
    footer a:hover,footer a:focus-visible{text-decoration:underline;text-underline-offset:3px}
    @media(max-width:380px){h1{font-size:clamp(57px,15vw,84px)}}
  </style>
</head>
<body>
  <main>
    <h1>@HOME</h1>
    <p class="subtitle">A series about where and how we watch movies.</p>
    <div class="coming">Coming soon.</div>
  </main>
  <footer>Produced by<br><a href="https://eleven59.com/">11:59</a></footer>
</body>
</html>
